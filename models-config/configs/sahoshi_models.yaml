# =============================================================================
# sahoshi_models.yaml — Sahoshi model stack configuration (models stream, C0)
# =============================================================================
# Owner: models stream. Read by model-host (SAHOSHI_MODELS_CONFIG, exported by
# infra/scripts/serve_models.sh), smoke_models.sh, and (documented fields) by
# brain/adaptive/embeddings streams. Tracked home: models-config/configs/
# (moved out of the untracked models symlink into the retired tree).
#
# HOST PATHS below (snapshot, llama-server binary, GGUF, bge-m3) document this
# GB10's layout. The weights are NOT in the repo: serve_models.sh takes them
# from explicit env paths (DECIDER_SNAPSHOT_PATH, LLAMA_SERVER_BIN, GEMMA_GGUF,
# BGE_M3_PATH — written to ~/.config/sahoshi/sahoshi.env by scripts/sahoshi_env.sh)
# and env always wins over this file.
#
# SECURITY / SSRF:
#   - `services` URLs below are PLATFORM CONFIG CONSTANTS (fixed internal
#     endpoints), not user-supplied URLs. They may be overridden only via the
#     operator env vars shown on each line. Outbound HTTP client code in this
#     stack must (a) accept http/https schemes only and (b) never fetch any
#     URL that originates from external/user input.
#   - No credentials live in this file; DB/service creds stay env-only.
#
# HARDWARE TARGET: NVIDIA GB10 (Grace-Blackwell DGX-Spark class) unified
# memory. /proc/meminfo MemTotal = 127,533,976 kB ≈ 121.63 GiB; the planned pool below keeps 121.44 GiB (source of
# truth on GB10 — nvidia-smi reports memory.total as N/A). See
# models-config/MEMORY_BUDGET.md for the full resident budget and measured RSS.

# ─── Service endpoints (fixed; env-overridable) ────────────────────────────
services:
  # Decider host (T5, pplx-decider-v1-27b). Owned by models stream.
  model_host: http://127.0.0.1:8083        # env: MODEL_HOST_URL
  # Tactical Gemma host (T4, llama.cpp OpenAI-compatible server).
  llama: http://127.0.0.1:8084             # env: LLAMA_BASE_URL
  # Embedding host (T1: pplx-embed-v2-late-0.6b multivector + bge-m3 dense).
  embedding: http://127.0.0.1:8085         # env: EMBEDDING_SERVICE_URL (the Sahoshi stack sets 127.0.0.1:8205)

# ─── T5 · pplx-decider-v1-27b (model-host :8083) ────────────────────────────
decider:
  # Snapshot directory path — HF resolves the double symlinks into blobs.
  # NEVER `cp -r` the snapshot tree: every file is a symlink -> ../../blobs/<sha>
  # and a naive copy produces dangling 380 KiB stubs.
  # The default decider. DECIDER_SNAPSHOT_PATH wins (sahoshi.env, then the
  # optional ~/.config/sahoshi/decider.env that
  # services/model-host/switch_decider.sh writes and removes).
  snapshot_path: ~/.cache/huggingface/hub/models--perplexity-ai--pplx-decider-v1-27b/snapshots/b01a5cbaca5391f73bd55103d4f27e8982cd5e60
  weights_bytes: 52170802640        # 48.58 GiB, 11 shards + 2.6 MB readout head
                                    # (pplx-decider-v1.2: 52173414048 = 48.59 GiB;
                                    #  pplx-decider-flash-v1.2: 9079921808 = 8.46 GiB)
  runtime: auto                     # auto (from the snapshot layout) | autojev
                                    # (protocol v1) | pplx_decider (protocol v3);
                                    # env DECIDER_RUNTIME
  question_mode: auto               # protocol v3 only: auto (joint for the 27B,
                                    # per_question for flash, per the model
                                    # cards) | joint | per_question;
                                    # env DECIDER_QUESTION_MODE
  fast: false                       # protocol v3 packed+compiled path: measured
                                    # slower than the reference path for single
                                    # requests on the GB10; env DECIDER_FAST
  # model_name: unset → the snapshot's repository name (/decider/health
  # "model"); env DECIDER_MODEL_NAME
  device: cuda                      # GB10 unified memory
  offline: true                     # HF_HUB_OFFLINE=1 — serve from disk only
  max_questions_per_request: 6      # C1: ≤6 typed questions per checkpoint
  max_state_tokens: 8192            # per-sequence hard cap: one question with
                                    # its state; past it HTTP 413, never truncated
                                    # (v3 joint: a longer request is split into
                                    # question chunks, each with the full state)
  state_tokens_pre_movement: 1500   # brain-side doc budget
  state_tokens_per_event: 400       # brain-side doc budget
  queue_depth: 8                    # serialized computes; 429 + Retry-After past this
  min_checkpoint_interval_sec: 5    # per-movement rate limit (brain-enforced)
  # temperature: each checkpoint's own decision_config.json (v1-27b 2.2076,
  # v1.2 1.382, flash-v1.2 1.554) — never overridden.
  health_degradation_p95_ms: 3000   # p95 above this → Gemma-only fallback (brain)

# ─── T4 · sahoshi-tactical Gemma 4 12B (llama-server :8084) ───────────────────
llama:
  server_bin: ~/llama.cpp/build/bin/llama-server   # build 69bf643; LLAMA_SERVER_BIN wins
  gguf: ~/models/q4-stack/v7h-merged-Q4_K_M.gguf  # 7,208,382 KiB; GEMMA_GGUF wins
  alias: sahoshi-tactical
  host: 127.0.0.1
  port: 8084
  ctx_per_slot: 8192     # 8192-token context per slot
  parallel_slots: 2      # 2 concurrent agent streams (compute-only serialization
                         # replaces the retired asyncio.Lock VRAM regime)
  ctx_total: 16384       # = slots × ctx_per_slot passed as llama-server -c
  keep_alive: forever    # llama-server never evicts the model (no TTL concept);
                         # process is supervised with restart-on-exit instead.
  metrics: true          # Prometheus endpoint /metrics on :8084
  jinja: true            # use the GGUF-embedded Gemma 4 canonical chat template
                         # (verified identical to aditi tokenizer chat_template.jinja)
  # Sampling defaults carried over from the tuned qwen stack (schema-constrained
  # decoding via response_format json_schema is layered on top by brain; see C2).
  temperature: 0.6
  top_p: 0.85
  top_k: 35
  repeat_penalty: 1.15
  num_predict: 2048

# ─── Ollama side-load (aux/standby, NOT the tactical serving path) ─────────
# The architecture serves Gemma via llama-server :8084. The ollama import of
# the same GGUF (Modelfile: models-config/Modelfile.gemma_sahoshi → gemma-sahoshi:12b)
# exists for operator/debug tooling against the already-running ollama daemon
# (:11434, externally active — do not restart or unload qwen3.5 there).
ollama:
  base_url: http://127.0.0.1:11434   # env: OLLAMA_BASE_URL (legacy; brain no longer calls)
  model: gemma-sahoshi:12b
  num_ctx: 8192
  keep_alive: -1            # OLLAMA_KEEP_ALIVE=-1 → never evict (unified pool)
  parallel: 1               # ollama stays a debugging path; the parallel serving
                            # tier is llama-server (2 slots above)

# ─── T1 · Embeddings (embedding-service :8205, EMBEDDING_PORT) ─────────────
# The code registry is authoritative (services/embedding-service/src/
# embedding_service/config.py: DENSE_MODELS / LATE_MODELS, pinned revisions);
# this block documents the deployed choice. Eval and reasoning:
# docs/ai/embeddings.md (SYNTHETIC Kolkata set, bn/en/hi/code-mixed, GB10).
# Env: EMBED_DENSE_MODEL, EMBED_LATE_MODEL, EMBED_RANK_MODE, EMBED_PII,
# EMBED_WARMUP (set in the unit; sahoshi.env overrides). After changing a
# model run services/embedding-service/scripts/reembed.py.
embeddings:
  multivector:                # MaxSim rerank; the brain's novelty / tier-0 floors are on this scale
    model: pplx-embed-v2-late-0.6b
    model_id: perplexity-ai/pplx-embed-v2-late-0.6b
    revision: 7bba8e7cf2075dec747fa8557f41eb90e70361ed
    dim: 128                  # per-token vector, ≤64 per doc (traffic.memory_docs CHECK)
    dtype: float32
    gpu_gib_measured: 3.2     # peak, eval run (weights 2.2)
    licence: MIT
  dense:                      # ANN recall (pgvector HNSW) + read-only POST /embed (OSINT dedup)
    model: pplx-embed-context-v1-4b
    model_id: perplexity-ai/pplx-embed-context-v1-4b
    revision: 679845b2236c653177fff8fa3ffc1b22f3090d30
    native_dim: 2560
    dim: 1024                 # Matryoshka prefix → the store's vector(1024); no migration
    dtype: bfloat16
    gpu_gib_measured: 8.8     # peak, eval run (weights 7.6)
    licence: MIT
    recall_k: 100             # MaxSim rerank candidate cap
    rerank_topk: 20
    fallback: bge-m3          # EMBED_DENSE_MODEL=bge-m3 (BGE_M3_PATH, default ~/models/bge-m3, 1024-d, 2.4 GiB)
  pii:                        # POST /pii/spans, loaded on first use; OSINT calls it only with OSINT_PII_MODEL=1
    model_id: perplexity-ai/PII-Tracer
    revision: d25c16f2e57e321f6d2527715c01df9112f956f5
    gpu_gib_measured: 1.2
    licence: MIT
  rank_mode: maxsim           # default; "fused" (dense z + MaxSim z) per request with {"rank": "fused"}
  aux_9b:
    enabled: false            # evaluated, not deployed (see docs/ai/embeddings.md)
    model_id: perplexity-ai/pplx-embed-v2-late-9b
  # shared venv pins (sentence-transformers >=6 MultiVectorEncoder stack):
  venv_pins:
    torch: 2.14.0
    torchvision: 0.29.0
    transformers: 5.17.0
    sentence_transformers: 6.1.0
    accelerate: 1.15.0
    pillow: 12.3.0
    safetensors: 0.8.0

# ─── Persistent venvs (volatile /tmp venvs are forbidden) ───────────────────
# Root: $SAHOSHI_VENV_DIR (default <repo>/.venvs; git-ignored). Built by
# `infra/scripts/serve_models.sh build`.
venvs:
  model_host: $SAHOSHI_VENV_DIR/model-host      # requirements: models-config/model-host-requirements.txt
  embedding: $SAHOSHI_VENV_DIR/embedding        # services/embedding-service[models]
  migrate: $SAHOSHI_VENV_DIR/migrate            # psycopg[binary] for scripts/migrate.py

# ─── GB10 unified-memory budget (planned; measured RSS in MEMORY_BUDGET.md) ─
memory_budget_gib:
  total_pool: 121.44
  model_host_decider: 55.0        # 48.58 weights + activation estimate; re-budget from /decider/health RSS
  llama_server_gemma: 9.5         # ~7.4 resident observed + KV/compute 2×8192
  embedding_service: 14.0         # measured live 11.0 reserved (late + dense + PII) + 0.5 RSS + headroom; bge-m3 fallback 6.0
  traffic_oracle_onnx: 0.4
  platform_services: 12.0         # PostGIS 2.0 + Valkey 0.5 + NATS 0.5 + oracle 3.5 + brain 1.5 + dev 4
  planned_total: 90.9
  headroom: 30.5
