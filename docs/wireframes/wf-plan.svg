  <text x="1062.7" y="630" font-size="12" font-weight="400" fill="#5E5E5E">min</text>
  <text x="1128" y="630" font-size="24" font-weight="700" fill="#262626">22</text>
  <text x="1162.7" y="630" font-size="12" font-weight="400" fill="#5E5E5E">km</text>
