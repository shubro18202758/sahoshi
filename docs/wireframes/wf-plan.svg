  <text x="20" y="1036" font-size="12" font-weight="400" fill="#5E5E5E">1 Four steps: Where to · Routes · Launch · Live. 2 The trip: from, to, the protection class from the protocol table, the departure and an optional rehearsal label (a labelled movement is never shown as a real one). 3 The routes on the</text>
  <text x="20" y="1053" font-size="12" font-weight="400" fill="#5E5E5E">map. 4 Routes ranked best first, with time, distance, the lane-floor check and what each adds; times are twin estimates on simulated traffic. 5 Continue to launch: the escort starts only when a named officer launches it; a lane-floor</text>
  <text x="20" y="1070" font-size="12" font-weight="400" fill="#5E5E5E">waiver is accepted by an officer before launch.</text>
