  <text x="60" y="746" font-size="15" font-weight="700" fill="#262626">গঙ্গায় জোয়ার-ভাটা</text>
  <rect x="333.1" y="731" width="86.9" height="20" rx="10" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.1" stroke-dasharray="4 3"/>
