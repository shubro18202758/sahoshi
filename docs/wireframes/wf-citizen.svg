  <text x="60" y="770" font-size="13.5" font-weight="400" fill="#262626">জোয়ার আসছে, এখন 4.6 মিটার। জোয়ারের জন্য খালের লকগেট</text>
  <text x="60" y="790" font-size="13.5" font-weight="400" fill="#262626">বন্ধ, তাই বৃষ্টির জল ধীরে নামছে। পরের জোয়ার 14:00-এ।</text>
  <text x="60" y="828" font-size="15" font-weight="700" fill="#262626">বৃষ্টি</text>
  <rect x="377.6" y="813" width="42.4" height="20" rx="10" fill="#FFFFFF" stroke="#9A9A9A" stroke-width="1.1"/>
  <text x="398.8" y="826.6" font-size="10" font-weight="600" text-anchor="middle" fill="#5E5E5E">লাইভ</text>
  <text x="60" y="852" font-size="13.5" font-weight="400" fill="#262626">এখন বৃষ্টি হচ্ছে, ঘণ্টায় প্রায় 18 মিমি।</text>
  <text x="60" y="890" font-size="15" font-weight="700" fill="#262626">যে রাস্তাগুলিতে নজর রাখবেন</text>
  <rect x="60" y="906" width="360" height="38" rx="10" fill="#F4F4F4" stroke="#A2A2A2" stroke-width="1.2"/>
