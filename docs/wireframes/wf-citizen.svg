  <text x="124" y="548" font-size="22" font-weight="700" fill="#262626">গভীর জল</text>
  <text x="76" y="586" font-size="15" font-weight="500" fill="#262626">প্রায় 45 মিনিটের মধ্যে গভীর জল (10 থেকে 30</text>
  <text x="76" y="608" font-size="15" font-weight="500" fill="#262626">সেমি) জমতে পারে। সম্ভব হলে দয়া করে অন্য</text>
  <text x="76" y="630" font-size="15" font-weight="500" fill="#262626">রাস্তা নিন।</text>
