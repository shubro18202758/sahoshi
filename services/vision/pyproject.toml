[project]
name = "vision-service"
version = "0.1.0"
description = "Sahoshi vision: road state from a camera still (waterlogged, blocked, tree fall, stalled vehicle, crash debris, congested, clear) with Qwen3-VL on llama.cpp; roads and vehicles only, never people, never plates"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.27",               # llama-server client
    "pillow>=10.4",              # downscale + re-encode (drops EXIF)
    "python-multipart>=0.0.9",   # optional multipart uploads; raw-body images work without it
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "slow: runs the real Qwen3-VL model through llama-server (VISION_SLOW=1 to enable)",
]
