[project]
name = "hydro"
version = "0.1.0"
description = "Sahoshi waterlogging nowcast for Kolkata — Open-Meteo rain × Hooghly tide (Garden Reach, MODELLED) × KMC pump state (FFEWS adapter, EMULATED) × terrain/drainage susceptibility (Copernicus DEM + OSM); per-segment risk class 0–3 with lead time; PROPOSALS only (a named officer decides)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.optional-dependencies]
# only scripts/build_susceptibility.py needs it (the service reads the committed result)
build = ["rasterio>=1.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydro"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
