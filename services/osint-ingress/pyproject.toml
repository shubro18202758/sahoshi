[project]
name = "osint-ingress"
version = "0.1.0"
description = "Sahoshi OSINT ingress: open sources to redacted, place-tagged RawOsintSignals, posted to the oracle (places and situations, never persons)"
requires-python = ">=3.12"
license = "MIT"
# The service imports osint_common (and, for `once --dry-run` only, osint_geo and osint_analysis) through
# PYTHONPATH, never as wheels (plan §4). defusedxml is the one dependency this WP adds: every RSS, Atom, CAP and
# XML parse of untrusted input goes through it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.scripts]
osint-ingress = "osint_ingress.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_ingress"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# `cd services/osint-ingress && pytest -q` works without PYTHONPATH; missing sibling paths are harmless (plan §4).
pythonpath = ["src", "../osint-common/src", "../osint-geo/src", "../osint-analysis/src"]
