[project]
name = "osint-geo"
version = "0.1.0"
description = "Sahoshi OSINT geo-resolver: an offline Kolkata gazetteer (English, Bengali and Hindi), toponym extraction, disambiguation, snap to the real OSM network and a calibrated geocode confidence (places only, no paid or online geocoder)"
requires-python = ">=3.12"
license = "MIT"
# The three runtime dependencies the WP names (OS-3). osint_common (pydantic) arrives through PYTHONPATH like every
# OSINT package (plan §4, X20); the oracle image and the osint-ingress image install them from this file (OS-INT).
dependencies = ["shapely>=2.0", "pyproj>=3.7", "numpy>=2.1"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_geo"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# `cd services/osint-geo && pytest -q` works without PYTHONPATH (plan §4: sibling sources, no wheel, no venv change).
pythonpath = ["src", "../osint-common/src"]
