[project]
name = "osint-analysis"
version = "0.1.0"
description = "Sahoshi OSINT analysis: classify, two-stage fusion and correlation, credibility, attach-to-live and second-order flags (places and situations, never persons)"
requires-python = ">=3.12"
license = "MIT"
# osint-common (and, for its consumers, osint-geo) arrive through PYTHONPATH, never a wheel or an index (plan §4).
dependencies = ["numpy>=2.1", "scikit-learn>=1.5", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_analysis"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# `cd services/osint-analysis && pytest -q` works without PYTHONPATH; a missing sibling path is harmless.
pythonpath = ["src", "../osint-common/src", "../osint-geo/src"]
