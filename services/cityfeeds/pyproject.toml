[project]
name = "cityfeeds"
version = "0.1.0"
description = "Sahoshi city feeds for Kolkata — air quality (Open-Meteo/CAMS, CPCB National AQI bands), heat (heat index, IMD heatwave test), GDACS cyclones and floods, CWC river levels for the DVC system, USGS quakes, the port tide table and KMC notices; cached, rate-limited, honestly labelled; PROPOSALS only (a named officer decides)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cityfeeds"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
