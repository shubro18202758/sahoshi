[project]
name = "osint-common"
version = "0.1.0"
description = "Sahoshi OSINT shared canonical types, ethics rails and vocabulary: places and situations, never persons"
requires-python = ">=3.12"
license = "MIT"
# The one dependency (plan §4, X20): the oracle, osint-ingress, osint-geo and osint-analysis all import this package
# through PYTHONPATH (no wheel, no index), so it must stay this small.
dependencies = ["pydantic>=2.10"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_common"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# `cd services/osint-common && pytest -q` works without PYTHONPATH=src.
pythonpath = ["src"]
